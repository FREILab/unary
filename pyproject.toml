[project]
name = "unary"
version = "0.2.0"
description = "A digital tally sheet for maker spaces."
authors = [{ name = "Johannes Jordan", email = "git@lanrules.de" }]
requires-python = ">=3.13"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = [
    "Flask>=2.3.2,<3",
    "Flask-SQLAlchemy>=3.0.3,<4",
    "Flask-SocketIO>=5.3.3,<6",
    "flask-migrate>=4.0.4,<5",
    "pyyaml~=6.0",
    "eventlet>=0.33.3,<0.34",
]

[dependency-groups]
dev = [
    "ruff>=0.12.10",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"
